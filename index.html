<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Engineering MOR/NOP Selectivity — A Computational Approach to Safer Analgesics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.16 0.008 250);
    --bg-1: oklch(0.19 0.009 250);
    --bg-2: oklch(0.22 0.010 250);
    --bg-3: oklch(0.26 0.011 250);
    --line: oklch(0.32 0.012 250);
    --line-soft: oklch(0.26 0.010 250);
    --fg: oklch(0.95 0.005 80);
    --fg-1: oklch(0.82 0.008 80);
    --fg-2: oklch(0.62 0.010 80);
    --fg-3: oklch(0.45 0.010 250);
    --accent: oklch(0.78 0.12 200);
    --accent-soft: oklch(0.78 0.12 200 / 0.15);
    --accent-line: oklch(0.78 0.12 200 / 0.4);
    --warn: oklch(0.75 0.12 70);
    --warn-soft: oklch(0.75 0.12 70 / 0.13);
    --mor: oklch(0.78 0.13 30);
    --nop: oklch(0.78 0.12 200);
    --dual: oklch(0.78 0.13 140);
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; overflow-x: hidden; }
  ::selection { background: var(--accent-soft); color: var(--fg); }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .mono { font-family: var(--mono); font-feature-settings: "tnum", "ss01"; }
  .serif { font-family: var(--serif); }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-2); }
  .hr { height: 1px; background: var(--line-soft); width: 100%; }

  #root { width: 100%; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line); }

  /* Reusable */
  .container { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  @media (max-width: 720px) { .container { padding: 0 20px; } }

  .section-num {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--fg-3);
    text-transform: uppercase;
  }

  .h-display {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(36px, 5vw, 72px);
    line-height: 1.04;
    letter-spacing: -0.02em;
  }
  .h-section {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(28px, 3.4vw, 44px);
    line-height: 1.1;
    letter-spacing: -0.015em;
  }
  .body { font-size: 16px; line-height: 1.65; color: var(--fg-1); }
  .body-lg { font-size: 18px; line-height: 1.6; color: var(--fg-1); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--fg-1);
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .card {
    border: 1px solid var(--line-soft);
    background: linear-gradient(180deg, var(--bg-1), var(--bg));
    border-radius: 8px;
  }

  .grid-bg {
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
  }
  .dot-bg {
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 18px 18px;
  }

  /* Top nav */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
    background: oklch(0.16 0.008 250 / 0.7);
    border-bottom: 1px solid var(--line-soft);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 40px;
    max-width: 1440px; margin: 0 auto;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; }
  .nav-brand .glyph {
    width: 22px; height: 22px; border: 1px solid var(--accent); border-radius: 4px;
    display: grid; place-items: center; color: var(--accent); font-size: 10px;
  }
  .nav-links { display: flex; align-items: center; gap: 28px; }
  .nav-links a { font-family: var(--mono); font-size: 12px; color: var(--fg-2); transition: color 0.15s; }
  .nav-links a:hover { color: var(--fg); }
  .nav-links a.active { color: var(--accent); }
  @media (max-width: 720px) { .nav-links { display: none; } .nav-inner { padding: 12px 20px; } }

  .fade-in { animation: fadeIn 0.6s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  .marquee-stat { font-family: var(--serif); font-weight: 400; }

  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</body>
</html>
